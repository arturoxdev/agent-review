<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1" />
    <title>Nuevo insumo · Armot</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 390px;
        min-height: 844px;
        background: #f7f7f5;
        color: #1c1917;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      header {
        position: relative;
        padding: 24px 16px 12px 56px;
        background: #ffffff;
        border-bottom: 1px solid #e7e5e4;
      }
      header .back {
        position: absolute;
        left: 12px;
        top: 26px;
        width: 32px;
        height: 32px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        background: #ffffff;
        font: inherit;
      }
      header h1 {
        margin: 0 0 12px;
        width: 230px;
        font-size: 22px;
        line-height: 28px;
        letter-spacing: -0.02em;
      }
      main { padding: 16px; }
      form .row { margin-bottom: 16px; }
      form label { display: block; width: fit-content; margin-bottom: 6px; font-weight: 600; color: #44403c; }
      form input,
      form select {
        width: 358px;
        height: 44px;
        padding: 10px 12px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        background: #ffffff;
        font: inherit;
        color: #1c1917;
      }
      form select { padding-right: 32px; }
      form .chips {
        display: flex;
        gap: 8px;
        width: 374px;
        height: 32px;
        margin-bottom: 24px;
        padding: 4px 8px;
        overflow: hidden;
        white-space: nowrap;
      }
      form .chips span {
        padding: 0 10px;
        border: 1px solid #d6d3d1;
        border-radius: 999px;
        background: #ffffff;
        line-height: 22px;
        font-size: 13px;
      }
      form button.px-4 {
        display: block;
        width: 358px;
        height: 48px;
        margin: 8px 0;
        padding: 12px 16px;
        border: 1px solid #1c1917;
        border-radius: 8px;
        background: #1c1917;
        color: #fafaf9;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <button class="back" type="button">‹</button>
      <h1>Nuevo insumo de inventario</h1>
    </header>
    <main>
      <form>
        <div class="row">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" value="Harina de trigo 000" />
        </div>
        <div class="row">
          <label for="unidad">Unidad</label>
          <select id="unidad">
            <option>Kilogramo</option>
            <option>Gramo</option>
            <option>Litro</option>
          </select>
        </div>
        <div class="row">
          <label for="cantidad">Cantidad</label>
          <input id="cantidad" type="text" value="25" />
        </div>
        <div class="row">
          <label for="precio">Precio unitario</label>
          <input id="precio" type="text" value="18.40" />
        </div>
        <div class="chips">
          <span>Abarrotes</span>
          <span>Lácteos</span>
          <span>Limpieza</span>
          <span>Empaque</span>
        </div>
        <button class="px-4" type="button">Guardar cambios</button>
      </form>
    </main>
  </body>
</html>
