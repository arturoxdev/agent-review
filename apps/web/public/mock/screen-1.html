<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Nuevo insumo · Armot</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1440px;
        min-height: 900px;
        background: #f7f7f5;
        color: #1c1917;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      header.top {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 56px;
        padding: 0 32px;
        background: #ffffff;
        border-bottom: 1px solid #e7e5e4;
      }
      header.top .brand { font-weight: 700; letter-spacing: -0.01em; }
      header.top nav { display: flex; gap: 20px; color: #78716c; }
      header.top nav .active { color: #1c1917; font-weight: 600; }
      .layout { display: flex; }
      aside {
        width: 240px;
        min-height: 844px;
        padding: 24px 16px;
        background: #ffffff;
        border-right: 1px solid #e7e5e4;
      }
      aside h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #a8a29e; }
      aside a { display: block; padding: 8px 12px; border-radius: 6px; color: #44403c; text-decoration: none; }
      aside a.active { background: #f5f5f4; font-weight: 600; color: #1c1917; }
      main { flex: 1; padding: 40px 80px; }
      main h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
      main p.sub { margin: 0 0 28px; color: #78716c; }
      form {
        position: relative;
        width: 880px;
        min-height: 460px;
        padding: 28px 32px 24px;
        background: #ffffff;
        border: 1px solid #e7e5e4;
        border-radius: 10px;
      }
      form .row { margin-bottom: 16px; }
      form label { display: block; width: fit-content; margin-bottom: 4px; font-weight: 600; color: #44403c; }
      form input,
      form select,
      form textarea {
        width: 280px;
        height: 40px;
        padding: 10px 12px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #ffffff;
        font: inherit;
        color: #1c1917;
      }
      form input.wide { width: 560px; }
      form textarea { width: 560px; height: 76px; }
      form .hint { margin-top: 6px; color: #a8a29e; font-size: 12px; }
      form button.px-4 {
        position: absolute;
        right: 32px;
        bottom: 20px;
        width: 96px;
        height: 40px;
        padding: 8px 16px;
        border: 1px solid #1c1917;
        border-radius: 6px;
        background: #1c1917;
        color: #fafaf9;
        font: inherit;
        font-weight: 600;
      }
      form button.ghost {
        position: absolute;
        right: 144px;
        bottom: 20px;
        height: 40px;
        padding: 8px 16px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #ffffff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <span class="brand">Armot</span>
      <nav>
        <span>Panel</span>
        <span class="active">Insumos</span>
        <span>Compras</span>
        <span>Proveedores</span>
      </nav>
    </header>
    <div class="layout">
      <aside>
        <h2>Inventario</h2>
        <a class="active" href="#">Insumos</a>
        <a href="#">Categorías</a>
        <a href="#">Almacenes</a>
        <a href="#">Movimientos</a>
      </aside>
      <main>
        <h1>Nuevo insumo</h1>
        <p class="sub">Registra un insumo para poder usarlo en órdenes de compra y recetas.</p>
        <form>
          <div class="row">
            <label for="nombre">Nombre</label>
            <input class="wide" id="nombre" type="text" value="Harina de trigo 000" />
          </div>
          <div class="row">
            <label for="clave">Clave interna</label>
            <input id="clave" type="text" value="INS-0421" />
          </div>
          <div class="row">
            <label for="cantidad">Cant.</label>
            <input id="cantidad" type="text" value="25" />
          </div>
          <div class="row">
            <label for="precio">Precio unitario</label>
            <input id="precio" type="text" value="18.40" />
            <div class="hint">Se usa como costo de referencia en las órdenes.</div>
          </div>
          <div class="row">
            <label for="notas">Notas</label>
            <textarea id="notas">Proveedor habitual: Molinos del Bajío.</textarea>
          </div>
          <button class="ghost" type="button">Cancelar</button>
          <button class="px-4" type="button">Guardar</button>
        </form>
      </main>
    </div>
  </body>
</html>
